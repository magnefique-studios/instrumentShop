name: PR Pipeline

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR merged into main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Deploy
        run: ./BuildAndDeploy.sh

      - name: Run tests
        run: bash all_tests.sh

  auto-document:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Skip if the PR only touches docs/, or if the last commit was auto-docs
    if: >-
      !contains(github.event.pull_request.title, '[docs]')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if last commit is auto-docs
        id: check_skip
        run: |
          if git log -1 --pretty=%s | grep -q "docs: auto-generated documentation"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate documentation
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          # replace this with your actual doc generation command
          run_code_analysis.sh

      - name: Commit and push docs back to PR branch
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "docs: auto-generated documentation"
          git push origin ${{ github.event.pull_request.head.ref }}
